version: "3.9"

# ─── NeuroVision AI — Docker Compose Stack ────────────────────────────────────
# Services: backend, frontend, postgres, redis, nginx
# GPU: uncomment 'deploy' sections to enable CUDA passthrough

networks:
  nv_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  model_data:
  upload_data:
  recording_data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nv_postgres
    restart: unless-stopped
    networks: [nv_net]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: neurovision
      POSTGRES_USER: neurovision
      POSTGRES_PASSWORD: neurovision_secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurovision"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nv_redis
    restart: unless-stopped
    networks: [nv_net]
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── AI Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nv_backend
    restart: unless-stopped
    networks: [nv_net]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes:
      - model_data:/app/models
      - upload_data:/app/data/uploads
      - recording_data:/app/data/recordings
      - /dev/video0:/dev/video0   # webcam passthrough (Linux)
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: neurovision
      DB_USER: neurovision
      DB_PASSWORD: neurovision_secret
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # AI
      AI_DEVICE: cuda          # change to 'cpu' if no GPU
      AI_HALF_PRECISION: "true"
      YOLO_MODEL: yolov8n.pt
      POSE_MODEL: yolov8n-pose.pt
      MODELS_DIR: /app/models
      # Streaming
      TARGET_FPS: "25"
      MAX_CAMERAS: "16"
      # App
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: "change-me-in-production-neurovision"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:80"]'
    ports:
      - "8000:8000"
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_WS_URL: ws://localhost:8000
    container_name: nv_frontend
    restart: unless-stopped
    networks: [nv_net]
    depends_on:
      - backend
    ports:
      - "3000:80"

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nv_nginx
    restart: unless-stopped
    networks: [nv_net]
    depends_on:
      - backend
      - frontend
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
